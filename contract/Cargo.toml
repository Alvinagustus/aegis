[package]
name = "watchdog"
version = "0.1.0"
edition = "2021"
description = "Watchdog Wallet — a policy engine guarding cross-chain spending through NEAR"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
